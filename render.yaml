services:
  # ─── Backend (Express + Socket.io) ────────────────────────────────────────
  - type: web
    name: heartsync-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: heartsync-db
          property: connectionString
      - key: PORT
        value: 5000
      # Add your own values for these in Render dashboard:
      - key: JWT_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

  # ─── Frontend (React + Vite) ───────────────────────────────────────────────
  - type: web
    name: heartsync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # Set to your backend URL in Render dashboard
      - key: VITE_SOCKET_URL
        sync: false   # Set to your backend URL in Render dashboard
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

# ─── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: heartsync-db
    databaseName: heartsync
    user: heartsync
    plan: free
